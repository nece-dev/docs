openapi: 3.0.3
info:
  title: OnePanel API
  version: 1.0.0
  description: API for OnePanel data vending and transaction management.
servers:
  - url: https://api.onepanel.ng/api/v1
    description: Production
tags:
  - name: Catalog
  - name: Purchases
  - name: Transactions
  - name: Account
  - name: Airtime Cash
paths:
  /networks:
    get:
      operationId: listNetworks
      summary: List supported networks
      tags: [Catalog]
      security: []
      responses:
        '200':
          description: Available network catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Network'
  /bundles:
    get:
      operationId: listBundles
      summary: List data plans
      tags: [Catalog]
      security: []
      parameters:
        - name: carrier
          in: query
          schema: { type: string, example: mtn }
        - name: category
          in: query
          schema: { type: string, example: Monthly }
        - name: q
          in: query
          schema: { type: string, example: 1GB }
      responses:
        '200':
          description: Current plan catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bundle'
  /bundles/categories:
    get:
      operationId: listBundleCategories
      summary: List plan categories
      tags: [Catalog]
      security: []
      parameters:
        - name: carrier
          in: query
          schema: { type: string, example: mtn }
      responses:
        '200':
          description: Available plan categories.
  /data/plans:
    get:
      operationId: listDataPlans
      summary: List data plans
      description: Stable alias of `/bundles`. Use a plan's `id` as `plan_id` when you buy.
      tags: [Catalog]
      security: []
      parameters:
        - name: carrier
          in: query
          schema: { type: string, enum: [mtn, glo], example: mtn }
      responses:
        '200':
          description: Available plans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bundle'
  /purchase:
    post:
      operationId: purchaseData
      summary: Buy data
      description: >
        Buys a catalogue plan for a recipient through one of your connected SIMs. The plan sets the
        price (any `amount` you send is ignored). Send a unique `reference` so a retry can never buy
        twice. See the Buy data guide for the full flow.
      tags: [Purchases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
            example:
              carrier: mtn
              plan_id: '1684'
              recipient: '08031234567'
              reference: order-2026-0001
      responses:
        '200':
          description: >
            The data was delivered. Also returned when you repeat a `reference` whose first
            purchase succeeded (the body then carries `idempotent: true`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseResponse' }
              example:
                success: true
                status: Success
                tx_id: TX_MTN_8F32A1BC
                transaction_id: TX_MTN_8F32A1BC
                reference: order-2026-0001
                message: 'Successfully activated 3.2GB 2-Day Plan for +234 08031234567 (Ref: 88b3fa64-621f-59b8-9a3a-5f7782cc7ee5)'
                ussd_fallback: '*312*1684#'
        '400':
          description: >
            Either the request is invalid (the body is `{ "message": "..." }`), or the carrier
            refused the purchase (the body is a full purchase response with `success: false`
            and `status: Failed`; `message` is the carrier's own reply when the carrier refused it).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PurchaseResponse'
                  - $ref: '#/components/schemas/Error'
              examples:
                carrierRefused:
                  summary: The carrier refused the purchase
                  value:
                    success: false
                    status: Failed
                    tx_id: TX_MTN_C41D9E02
                    transaction_id: TX_MTN_C41D9E02
                    reference: order-2026-0001
                    message: We couldn’t complete your request at the moment. Please try again
                    ussd_fallback: '*312*1684#'
                invalidRequest:
                  summary: Invalid request
                  value:
                    message: plan_id is required
        '401':
          description: Missing, invalid or revoked API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Insufficient wallet balance for the platform fee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            Either the same plan was bought for the same recipient in the last 60 seconds, or the
            `reference` was already used for a purchase that did not succeed (the body then carries
            `idempotent: true`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseResponse' }
        '429':
          description: Rate limit exceeded. Retry with backoff, using the same `reference`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
  /data/purchase:
    post:
      operationId: purchaseDataAlias
      summary: Buy data (alias)
      description: Identical to `POST /purchase`. Accepts `network_id` and `phone` as alternative field names.
      tags: [Purchases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
            example:
              network_id: 1
              plan_id: '1684'
              phone: '08031234567'
              reference: order-2026-0001
      responses:
        '200':
          description: >
            The data was delivered. Also returned when you repeat a `reference` whose first
            purchase succeeded (the body then carries `idempotent: true`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseResponse' }
              example:
                success: true
                status: Success
                tx_id: TX_MTN_8F32A1BC
                transaction_id: TX_MTN_8F32A1BC
                reference: order-2026-0001
                message: 'Successfully activated 3.2GB 2-Day Plan for +234 08031234567 (Ref: 88b3fa64-621f-59b8-9a3a-5f7782cc7ee5)'
                ussd_fallback: '*312*1684#'
        '400':
          description: >
            Either the request is invalid (the body is `{ "message": "..." }`), or the carrier
            refused the purchase (the body is a full purchase response with `success: false`
            and `status: Failed`; `message` is the carrier's own reply when the carrier refused it).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PurchaseResponse'
                  - $ref: '#/components/schemas/Error'
              examples:
                carrierRefused:
                  summary: The carrier refused the purchase
                  value:
                    success: false
                    status: Failed
                    tx_id: TX_MTN_C41D9E02
                    transaction_id: TX_MTN_C41D9E02
                    reference: order-2026-0001
                    message: We couldn’t complete your request at the moment. Please try again
                    ussd_fallback: '*312*1684#'
                invalidRequest:
                  summary: Invalid request
                  value:
                    message: plan_id is required
        '401':
          description: Missing, invalid or revoked API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Insufficient wallet balance for the platform fee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            Either the same plan was bought for the same recipient in the last 60 seconds, or the
            `reference` was already used for a purchase that did not succeed (the body then carries
            `idempotent: true`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseResponse' }
        '429':
          description: Rate limit exceeded. Retry with backoff, using the same `reference`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
  /transactions:
    get:
      operationId: listTransactions
      summary: List transactions
      tags: [Transactions]
      responses:
        '200':
          description: Transactions for the authenticated business account.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current account
      tags: [Account]
      responses:
        '200':
          description: Current account profile.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
  /airtime-cash/sessions:
    post:
      operationId: createAirtimeCashSession
      summary: Start a session on a user's MTN line
      description: >
        Sends an OTP by SMS to the user's MTN number. Only call this after the user has agreed
        to let your business move airtime from their line. Verify the code with
        `/airtime-cash/sessions/{id}/verify`.
      tags: [Airtime Cash]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
            example:
              msisdn: '08031234567'
              consent: true
              consent_ref: consent-2026-11-09-8841
      responses:
        '201':
          description: OTP sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStarted' }
        '400':
          description: Invalid number, or `consent` is not true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many codes requested for this number. Wait and try again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
    get:
      operationId: listAirtimeCashSessions
      summary: List sessions
      tags: [Airtime Cash]
      responses:
        '200':
          description: Sessions opened by your business (stored credentials are never returned).
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
  /airtime-cash/sessions/{id}/verify:
    post:
      operationId: verifyAirtimeCashSession
      summary: Verify the OTP and activate the session
      description: >
        Once verified, OnePanel keeps the user's MTN login (encrypted) so later transfers need no
        new OTP. Keep the returned `session_id` for that user.
      tags: [Airtime Cash]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { type: string, example: '123456' }
      responses:
        '200':
          description: Session is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStarted' }
        '401':
          description: Wrong code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No pending session with this ID.
        '410':
          description: The code expired or too many wrong attempts were made. Start a new session.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
  /airtime-cash/sessions/{id}:
    delete:
      operationId: revokeAirtimeCashSession
      summary: Revoke a session
      description: Deletes the stored MTN login for this session immediately.
      tags: [Airtime Cash]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session revoked.
        '404':
          description: Session not found.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
  /airtime-cash/transfers:
    post:
      operationId: createAirtimeCashTransfer
      summary: Move airtime from a user's line to your SIM
      description: >
        Sends airtime from the session's MTN line to your connected MTN SIM. Credit the user only
        when `status` is `success` (or when you receive the `airtime_cash.transfer.success` webhook).
        The user's 4-digit MTN transfer PIN must be sent with every request; it is never stored.
        Repeating a `reference` never sends twice: you get the original result back.
      tags: [Airtime Cash]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
            example:
              session_id: 3f1c2a9e-5b1d-4f0e-9a58-1d2b7c6e8a10
              amount: 1000
              pin: '1234'
              reference: order-2026-0001
      responses:
        '200':
          description: Airtime received (`status` is `success`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '202':
          description: >
            Result not confirmed yet (`status` is `pending` or `unknown`). Do not credit the user
            and do not resend; check `GET /airtime-cash/transfers/{reference}`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '422':
          description: >
            Refused. Either MTN rejected the transfer (`status` is `failed`, `message` is MTN's own
            reply, for example a wrong PIN), or the amount is over one of your limits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '409':
          description: >
            The session is not usable. `session_status` is `reauth_required` or `expired`: ask the
            user for a new OTP. Also returned when you have no connected MTN SIM to receive airtime.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many failed transfers on this session in the last hour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
    get:
      operationId: listAirtimeCashTransfers
      summary: List transfers
      tags: [Airtime Cash]
      responses:
        '200':
          description: Your latest 200 transfers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfers:
                    type: array
                    items: { $ref: '#/components/schemas/Transfer' }
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
  /airtime-cash/transfers/{reference}:
    get:
      operationId: getAirtimeCashTransfer
      summary: Get a transfer by your reference
      tags: [Airtime Cash]
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The transfer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '404':
          description: No transfer with this reference.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
  /airtime-cash/settings:
    get:
      operationId: getAirtimeCashSettings
      summary: Get your spending limits
      tags: [Airtime Cash]
      responses:
        '200':
          description: Your limits and the platform ceilings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AirtimeCashSettings' }
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
    put:
      operationId: updateAirtimeCashSettings
      summary: Set your spending limits
      description: >
        Limits can also be set on the Airtime Cash page of the dashboard. Daily limits reset at
        midnight Nigerian time.
      tags: [Airtime Cash]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_per_transfer, max_daily_per_sim, max_daily_total, session_expiry_days]
              properties:
                max_per_transfer: { type: integer, example: 5000 }
                max_daily_per_sim: { type: integer, example: 20000 }
                max_daily_total: { type: integer, example: 200000 }
                session_expiry_days: { type: integer, example: 30 }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AirtimeCashSettings' }
        '400':
          description: A value is outside the allowed range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Network:
      type: object
      required: [id, name, purchase_supported]
      properties:
        id: { type: string, example: mtn }
        name: { type: string, example: MTN Nigeria }
        purchase_supported: { type: boolean, example: true }
    Bundle:
      type: object
      required: [id, name, amount, validity, carrier]
      properties:
        id: { type: string, example: '1650' }
        name: { type: string, example: 1GB Data }
        amount: { type: string, example: '1650.00' }
        validity: { type: string, example: 30 days }
        description: { type: string }
        category: { type: string, example: Monthly }
        sub_category: { type: string, example: Monthly }
        carrier: { type: string, example: mtn }
    PurchaseRequest:
      type: object
      required: [plan_id, recipient]
      description: Send `carrier` or `network_id`, a `plan_id` and a `recipient`.
      properties:
        carrier: { type: string, enum: [mtn, glo], description: The network. Required unless you send `network_id`., example: mtn }
        network_id: { type: integer, description: 'Alternative to `carrier`: 1 = MTN, 2 = Glo. 3 (Airtel) and 4 (9mobile) are not supported yet.', example: 1 }
        plan_id: { type: string, description: The plan's `id` from the catalogue., example: '1684' }
        recipient: { type: string, description: The Nigerian number that receives the data. `phone` is accepted as an alias., example: '08031234567' }
        reference: { type: string, maxLength: 128, description: Your unique ID for this purchase. Reusing it never buys twice. `customer_reference` and `idempotency_key` are accepted aliases., example: order-2026-0001 }
        sim_id: { type: string, description: Optional connected SIM to use. If omitted, a SIM with enough airtime is chosen. }
    PurchaseResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: string, enum: [Success, Failed], example: Success }
        tx_id: { type: string, description: OnePanel's transaction ID., example: TX_MTN_8F32A1BC }
        transaction_id: { type: string, description: Same as `tx_id`., example: TX_MTN_8F32A1BC }
        reference: { type: string, nullable: true, description: The reference you sent., example: order-2026-0001 }
        message: { type: string, description: The result. For a carrier refusal this is the carrier's own reply., example: Successfully activated 3.2GB 2-Day Plan for +234 08031234567 }
        ussd_fallback: { type: string, description: The USSD code that buys the same plan by hand., example: '*312*1684#' }
        idempotent: { type: boolean, description: Present and true when this is the original result of a repeated `reference`. }
    Transaction:
      type: object
      properties:
        id: { type: string }
        carrier: { type: string }
        plan_name: { type: string }
        product_code: { type: string }
        amount: { type: string }
        recipient: { type: string }
        status: { type: string, enum: [Success, Failed] }
        ussd_code: { type: string }
        error_reason: { type: string, nullable: true }
        created_at: { type: string }
    CreateSessionRequest:
      type: object
      required: [msisdn, consent]
      properties:
        msisdn: { type: string, description: The user's MTN number, example: '08031234567' }
        consent: { type: boolean, description: Must be true. The user agreed to this access., example: true }
        consent_ref: { type: string, maxLength: 128, description: Your own record of the user's consent. }
    SessionStarted:
      type: object
      properties:
        session_id: { type: string, example: 3f1c2a9e-5b1d-4f0e-9a58-1d2b7c6e8a10 }
        status: { type: string, enum: [pending, active] }
        msisdn: { type: string, example: '2348031234567' }
        message: { type: string }
    Session:
      type: object
      properties:
        id: { type: string }
        msisdn: { type: string }
        status: { type: string, enum: [active, reauth_required, expired, revoked] }
        consent_ref: { type: string, nullable: true }
        created_at: { type: string }
        last_used_at: { type: string, nullable: true }
    TransferRequest:
      type: object
      required: [session_id, amount, pin, reference]
      properties:
        session_id: { type: string }
        amount: { type: integer, description: Whole naira. Minimum 50., example: 1000 }
        pin: { type: string, description: The user's 4-digit MTN airtime-transfer PIN. Never stored., example: '1234' }
        reference: { type: string, maxLength: 64, description: Your unique reference. Repeating it never sends twice., example: order-2026-0001 }
    Transfer:
      type: object
      properties:
        success: { type: boolean }
        transfer_id: { type: string, example: ACT_5d0c8b1e }
        reference: { type: string, example: order-2026-0001 }
        session_id: { type: string }
        amount: { type: integer, example: 1000 }
        status: { type: string, enum: [success, failed, pending, unknown] }
        mtn_transaction_id: { type: string, nullable: true }
        message: { type: string, nullable: true, description: MTN's own reply for this transfer. }
        created_at: { type: string }
    AirtimeCashSettings:
      type: object
      properties:
        max_per_transfer: { type: integer, example: 5000 }
        max_daily_per_sim: { type: integer, example: 20000 }
        max_daily_total: { type: integer, example: 200000 }
        session_expiry_days: { type: integer, example: 30 }
        limits:
          type: object
          description: Platform ceilings you cannot raise a limit above.
          properties:
            min_transfer: { type: integer, example: 50 }
            max_per_transfer: { type: integer, example: 50000 }
            max_daily_per_sim: { type: integer, example: 100000 }
            max_daily_total: { type: integer, example: 1000000 }
            max_session_expiry_days: { type: integer, example: 90 }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
